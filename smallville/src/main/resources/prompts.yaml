reactions:
  conversation: |
    {{agent.summary}}
    {{other.summary}}

    Create a fake conversation between {{agent.name}} and {{other.name}}
    Topic: {{observation}}

    For example, a conversation between people named A and B would look like this

    A: Hello, how are you today?
    B: I am good, and you?

  groupConversation: |
    People present:
    {{agent.name}}: {{agent.description}}
    {{#others}}
    {{name}}: {{description}}
    {{/others}}

    How these people know each other:
    {{history}}

    Create a natural, believable conversation among everyone listed above, all of whom are together right now.
    Topic: {{observation}}
    Let the history above shape the tone. People meeting for the first time are more tentative and introduce themselves; people who know each other well skip the pleasantries; people with friction between them are shorter with each other.
    Not everyone has to speak in every line, but everyone present should get at least one line if it feels natural for a real group conversation. People can react to what was just said, talk over each other's points, or bring up something new.

    For example, a conversation between people named A, B, and C would look like this

    A: Did you hear about the thing at the market?
    B: No, what happened?
    C: I heard about it too, from Dana.
    A: Right, that's the one.

  conversationTone: |
    Here is a conversation that just took place:

    {{transcript}}

    How did it leave the people in it feeling about each other?

    Answer with exactly one word and nothing else: warm, neutral, or tense.

  say: |
    {{agent.summary}}
    
    
    {{observation}}
    
    What would {{agent.name}} say?

  reaction: |
    {{world.description}} 
    {{agent.summary}}
      
    Plans: {{#agent.plans}}{{description}}; {{/agent.plans}}
    Relevant Memories: {{#memories.relevant}}{{description}}; {{/memories.relevant}}

    List the reasons and say yes or no whether or not {{agent.name}} would change their plans given the observation.

    Respond in the following format.
    Observation: a burning house
    Reasoning: a burning house is highly important. {{agent.name}} would likely react to a burning house.
    Answer: Yes, {{agent.name}} would react and try to put the fire out
    Conversation: No, there is no one to talk to

    Observation: a chirping bird
    Reasoning: a chirping bird is a common occurence and doesn't interest {{agent.name}}
    Answer: No, {{agent.name}} would not react
    Conversation: No, there is no one to talk to and the event doesn't interest {{agent.name}} enough

    Observation: {{agent.name}} sees x in a burning house
    Reasoning: x being stuck in a burning house interests {{agent.name}}
    Answer: Yes, {{agent.name}} would change their plans
    Conversation: Yes, with x to make sure they are OK. x cannot have the same name as {{agent.name}}

    Observation: {{observation}}
    Reasoning: ...
    Answer: ...
    Conversation: ...

world:
  objectStates: |
    {{world.description}}

    {{tenses}}

    What are the new states of the objects?

    For example:
    House has cofee machine and a shower;

    you are no longer cooking coffee and are now taking a shower

    Coffee Machine: Off
    Shower: On

plans:
  # Invariant instructions first, volatile state last - see the note on
  # longTerm below for why the ordering matters.
  shortTerm: |
    You are breaking down one resident's next hour in a small town simulation.

    Respond with only a json object, in exactly this shape:
    {"plans": [{"time": "9:00 am", "location": "Red House: Kitchen", "activity": "make a pot of coffee"}]}

    * "time" must be a clock time like "9:00 am".
    * "location" must be one of the available locations, written exactly as given below.
    * "activity" is what the resident is doing there, in a few words.
    * Give 3 to 5 entries covering the next hour, in order, at roughly
      15 minute intervals - not a single entry for the whole hour.

    ---
    Everything below is specific to right now and to this resident.

    {{world.description}}
    {{agent.summary}}
    Daily Requirement: {{#agent.plans}}{{description}};{{/agent.plans}}
    Relevant Memories: {{#memories.relevant}}{{description}}; {{/memories.relevant}}
    Observation: {{observation}}

    The current time is {{date.time}}. Break down {{agent.name}}'s plan for the
    next hour starting now.

  # Everything invariant is deliberately FIRST and everything that changes per
  # agent and per tick is LAST. DeepSeek's context cache matches on prefixes,
  # and cached input costs a small fraction of fresh input. With the volatile
  # world description at the top - as this prompt used to have it - the ~1500
  # tokens of examples below could never be reused between calls, because the
  # prefix differed every time.
  longTerm: |
    You are writing one resident's plan for the day in a small town simulation.

    A plan is what someone intends before the day happens. It says where they
    mean to be and what they mean to do there - not how any of it turns out.

    Rules:
    * Only use the available locations given below.
    * Include the time the resident wakes up and falls asleep.
    * 5-8 entries covering the big chunks of the day: waking up, a couple of main activities, meals, sleep.

    This is the shape of a good plan. Note that it is ordinary, and that every
    entry stops at the intention:

    8:00 am at the Oak Hill College Dorm: Klaus Mueller's room: bed, wake up and get ready for school;
    9:00 am at the Oak Hill College Dorm: Klaus Mueller's room: desk, read and take notes for research paper;
    12:00 pm at the Hobbs Cafe, have lunch;
    2:00 pm at the Oak Hill College: Library, keep working on the paper;
    6:00 pm at the Oak Hill College Dorm: Kitchen, make dinner;
    10:00 pm at the Oak Hill College Dorm: Klaus Mueller's room: bed, go to sleep

    Another good one, for a different sort of person:

    5:30 am at the Farm: Barn, wake up and start the morning milking;
    8:00 am at the Farm: Kitchen, have breakfast;
    9:30 am at the Market: Stalls, sell the week's eggs;
    1:00 pm at the Farm: Fields, mend the south fence;
    7:00 pm at the Tavern, have a drink and see who is about;
    10:30 pm at the Farm: Bedroom, go to sleep

    These would be bad plans, because they write the day's events in advance
    instead of stating intentions:

    9:00 am at the Market, notice a watch is missing and realise it was stolen;
    11:00 am at the Police Station, file a report about the theft;
    2:00 pm at the Cafe, get sidetracked by an argument and end up leaving early

    Respond with only a json object, in exactly this shape:
    {"plans": [{"time": "8:00 am", "location": "Red House: Bedroom", "activity": "wake up and get dressed"}]}

    ---
    Everything below is specific to today and to this resident.

    {{world.description}}
    {{agent.summary}}
    Relevant Memories: {{#memories.relevant}}{{description}}; {{/memories.relevant}}
    Observation ({{date.time}}): {{observation}}

    It is currently {{date.full}}. Write {{agent.name}}'s plan for today in
    broad strokes.

  current: |
    {{world.description}}
    Schedule: {{#agent.shortPlans}}{{description}}; {{/agent.shortPlans}}

    * The location should always include a leaf location or object chosen from the available locations
    * The lines above starting with another person's name state where that person actually is right now - this is ground truth.
    * If your schedule mentions doing something with another named person, only describe them as present if the ground truth above confirms they are at your same location right now. Otherwise, describe yourself doing the activity alone or improvising, and do not claim they are with you.

    What is your activity at {{date.time}}?

    For example:
    Activity: swimming laps in the pool
    Location: Gym: Swimming Pool
    Emoji: 🏊

    Activity: ...
    Location: ...
    Emoji: ...

agent:
  # statements are from the memory stream
  reflectionResult: |
    Statements about {{agent.name}}
    {{statements}}
    What single high-level insight can you infer from
    the above statements? (example format: insight (because of 1, 5, 3))

  # The result of this prompt is sent to fetch memories from memory stream
  reflectionQuestion: |
    {{#agent.recentMemories}}
    - {{description}}
    {{/agent.recentMemories}}
    Given only the information above, what are 3 most salient high-level questions we can answer about the subjects in the statements?

  characteristics: |
    How would one describe {{agent.name}}'s core characteristics in 3 words
    given the following statements?
    {{#memories.characteristics}}
     - {{description}}
    {{/memories.characteristics}}

  summary: |
    Pretend you are {{agent.name}}

    Name: {{agent.name}}
    Innate Traits: {{agent.traits}}
    Characteristics: {{agent.description}}
    Current Location: {{agent.locationName}}

    {{date.full}}

  askQuestion: |
    {{agent.summary}}
    {{memories.relevant}}

    Pretend you are answering questions from a news reporter. It is currently {{date.full}}
        
    The news reporter has asked you: {{question}}

misc:
  combineSentences: |
    {{agent.name}}'s current status: {{agent.activity}}
    {{agent.name}}'s past status: {{agent.lastActivity}}

    Format the current and past activity to say x is no longer {past status} and is now {current status}
  rankMemories: |
    On the scale of 1 to 10, where 1 is purely mundane
    (e.g., brushing teeth, making bed) and 10 is extremely poignant (e.g., a break up, college
    acceptance), rate the likely poignancy of the following pieces of memory. Always answer with only a list of numbers. For example, if given the following memories Memories: John did nothing; John lin went to school; John lin saw a concert
    respond with [1, 2, 6]. If just given one memory still respond in a list. Memories are separated by semi colans (;) 

    Memories: {{#memories.unranked}}{{description}}; {{/memories.unranked}}

  # Do not touch, debug is just used for testing purposes
  debug: |
    ping: {{ping}}
    memories.characteristics: {{memories.characteristics}}
    tenses: {{tenses}}
    question: {{question}}
    world.description: {{world.description}}
    date.yesterday: {{date.yesterday}}
    date.time: {{date.time}}
    date.full: {{date.full}}
    memories.relevant: {{#memories.relevant}}{{description}}; {{/memories.relevant}}
    memories.characteristics: {{#memories.characteristics}}{{description}}; {{/memories.characteristics}}
    memories.unranked: {{#memories.unranked}}{{description}}; {{/memories.unranked}}
    agent.plans: {{#agent.plans}}{{description}}; {{/agent.plans}}
    agent.locationChildren: {{agent.locationChildren}}
    agent.locationName: {{agent.locationName}}
    agent.description: {{agent.description}}
    agent.lastActivity: {{agent.lastActivity}}
    agent.memories: {{#agent.memories}}{{description}}; {{/agent.memories}}
    agent.name: {{agent.name}}
    agent.plansBlock: {{agent.plansBlock}}
story:
  first: |
    You are narrating the story of a small town for a life simulation game, based on real events from a simulation, not fiction you invent.

    The only real residents of this town are: {{roster}}
    Do not introduce, name, or refer to any person who is not on this list. Every character in the recap must be one of these people.

    The current in-world date and time is: {{now}}
    Everything below happened on or before this date and time. Do not invent an earlier scene, a different day, or a "meanwhile, earlier that week" flashback that isn't directly supported by the material below - if something isn't given below, it did not happen and must not appear.

    Here is what has happened so far, drawn from each resident's diary:

    {{diary}}

    Here are the conversations that took place:

    {{conversations}}

    Write a clear, engaging prose recap of what has happened, in past tense, third person, like a narrator catching a reader up on a story. Prioritize what actually happened and what people said over describing scenery, weather, or mood - a touch of atmosphere is fine, but don't let it crowd out the events. If a stretch had little or nothing happen, say so briefly rather than inventing scene-setting to fill the space. Keep it only as long as the material actually warrants - do not pad it out. Only use what is given above - do not invent characters, events, locations, or details that are not directly supported by this material, and do not repurpose a real conversation into a different day or a different set of participants than it actually happened with. You can mention the current in-world time naturally if it's useful, but do not end with a formal paragraph summarizing where everyone stands.

  continuation: |
    You are continuing the story of a small town for a life simulation game, based on real new events from a simulation, not fiction you invent.

    The only real residents of this town are: {{roster}}
    Do not introduce, name, or refer to any person who is not on this list. Every character in this passage must be one of these people.

    STORY SO FAR (already written and established - do not restate, summarize, or rewrite any of this, it is here only so you understand the tone and continuity):
    {{storySoFar}}

    The current in-world date and time is: {{now}}
    The new material below happened on or before this date and time. Do not invent an earlier scene, a different day, or a "meanwhile, earlier" flashback that isn't directly supported by the material below - if something isn't given below or in the story so far, it did not happen and must not appear.

    Here is what is NEW since the story above was last updated, drawn from each resident's diary:

    {{diary}}

    Here are the new conversations that took place:

    {{conversations}}

    Write ONLY the next passage of the story, continuing directly from where it left off, in the same voice and tense. Prioritize what actually happened and what people said over describing scenery, weather, or mood - a touch of atmosphere is fine, but don't let it crowd out the events, and don't re-describe light, weather, or setting you've already established recently. If this stretch had little or nothing happen, say so briefly in a sentence or two rather than inventing a full scene to fill the space. Keep the length proportional to how much actually happened - do not pad it out. Do not include a heading or any re-summary of what came before. Only use what is given above as new material - do not invent events, locations, or details that are not directly supported by this material, do not repurpose a real conversation into a different day or a different set of participants than it actually happened with, and do not contradict anything already established. You can mention the current in-world time naturally if it's useful, but do not end with a formal paragraph summarizing where everyone stands.

  compact: |
    Below is a running summary of a town's story, followed by later passages of that story that are not yet covered by it.

    Existing summary (may be empty if this is the first time):
    {{summary}}

    Passages to fold in:
    {{passages}}

    Rewrite the summary so it covers the existing summary AND the new passages together, as one continuous account.

    This summary is not shown to readers. It exists so a narrator can continue the story without being given every earlier passage in full, so it must preserve what a writer would need for continuity: who these people are to each other, what has actually happened between them, unresolved threads, and anything established that later passages must not contradict.

    Write plain past-tense prose, no headings or bullet points. Be compact - aim for a few paragraphs at most - but never drop a named person or a concrete event just to save room. Do not invent anything that is not in the material above.

  generateCharacter: |
    Invent an original resident of a small town for a life simulation game.

    Names already in use, your character's name (first and last) must NOT match or closely resemble any of these: {{existingNames}}

    Respond with only a json object, no markdown code fences, no commentary, in exactly this shape:
    {"name": "First Last", "memories": ["...", "...", "...", "...", "..."]}

    Rules for "memories":
    - Provide 5 to 7 entries.
    - Each entry is a separate, specific sentence written in third person, starting with the character's first name.
    - Together they must cover: their job or daily role, at least two distinct personality traits (not just "friendly" or "kind" alone - be specific and a little unusual), one meaningful relationship or social dynamic (family, friend, rival, unrequited crush, etc.), one personal goal or desire, and one flaw, fear, secret, or contradiction that makes them feel like a real person rather than a stock character.
    - Avoid generic filler like "X likes reading" as the only trait - go deeper into why, or pair it with something more surprising.
    - Do not repeat the same idea across multiple entries.
