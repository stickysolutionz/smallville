#Configuration options to run through LocalAI
apiPath: https://api.deepseek.com/chat/completions
# LLM model should support function calling
model: deepseek-v4-pro
# Model for the calls that are really classification rather than creative work
# - ranking memories, choosing an activity, judging the tone of a conversation.
# Roughly a third the price. Leave blank to send everything to `model`.
cheapModel: deepseek-v4-flash

# Thinking mode. Reasoning tokens are billed as output, and very little of what
# this app asks for benefits from deliberation - a six line daily plan has been
# seen carrying several hundred tokens of it. Leave blank to send nothing and
# accept the model's default. Set to "disabled" to try switching it off, then
# check /usage: if reasoningTokens drops to zero it took effect.
thinking: disabled

# Prices per million tokens, used only to estimate cost on /usage. Update these
# if DeepSeek's pricing changes. Note that prices double during peak hours
# (09:00-12:00 and 14:00-18:00 Beijing time), which this does not model.
inputPricePerMillion: 0.435
cachedInputPricePerMillion: 0.003625
outputPricePerMillion: 0.87
timeFormat: h:mm a
fullTimeFormat: EEEE, MMMM d, h:mm a
yesterdayFormat: EEEE MMMM d
# The weighted sum of recent memories needed to trigger a reflection. Should
# fire a handful of times per simulated day, not every tick.
#
# Measured on a real run: the sum sits around 325 median, 715 max, so the old
# value of 50 fired on 87% of agent updates and made reflection the single
# largest cost in the system. It reads as 50 because recency used to be broken
# and contributed almost nothing to the sum; fixing recency raised every value
# without anyone moving this. 600 fires on roughly 8%.
#
# Note the sum grows as an agent accumulates memories, so this may need raising
# again over a very long run.
reflectionCutoff: 600
#Set to true if the simulation.yaml file should be used to initialize the simulation
simulationFile: false
# How many times ChatGPT should attempt to send a prompt before aborting
maxRetries: 2

# Memory retrieval. A memory is scored as the weighted sum of how recent, how
# important and how relevant it is, each bounded to 0-1 first.
#
# How long, in SIMULATED hours, before a memory counts as half as recent.
recencyHalfLifeHours: 8
# How many memories to feed into a prompt as "relevant memories".
retrievalCount: 3
# Relative pull of each component. Raise relevanceWeight to make agents more
# single-minded about the topic at hand; raise recencyWeight to make them more
# reactive to what just happened.
recencyWeight: 1.0
importanceWeight: 1.0
relevanceWeight: 1.0