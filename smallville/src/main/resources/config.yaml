#Configuration options to run through LocalAI
apiPath: https://api.deepseek.com/chat/completions
# LLM model should support function calling
model: deepseek-v4-pro
timeFormat: h:mm a
fullTimeFormat: EEEE, MMMM d, h:mm a
yesterdayFormat: EEEE MMMM d
#The weighted sum of recent memories to trigger a reflection. This value
#depends on how many memories are added each time step and should only be
#triggered 3-5 times per simulated day
reflectionCutoff: 50
#Set to true if the simulation.yaml file should be used to initialize the simulation
simulationFile: false
# How many times ChatGPT should attempt to send a prompt before aborting
maxRetries: 2

# Memory retrieval. A memory is scored as the weighted sum of how recent, how
# important and how relevant it is, each bounded to 0-1 first.
#
# How long, in SIMULATED hours, before a memory counts as half as recent.
recencyHalfLifeHours: 8
# How many memories to feed into a prompt as "relevant memories".
retrievalCount: 3
# Relative pull of each component. Raise relevanceWeight to make agents more
# single-minded about the topic at hand; raise recencyWeight to make them more
# reactive to what just happened.
recencyWeight: 1.0
importanceWeight: 1.0
relevanceWeight: 1.0